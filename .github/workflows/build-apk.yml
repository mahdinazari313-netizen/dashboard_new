name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MT5Dashboard/mt5dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MT5Dashboard-debug
          path: MT5Dashboard/mt5dashboard/app/build/outputs/apk/debug/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MT5Dashboard-release
          path: MT5Dashboard/mt5dashboard/app/build/outputs/apk/release/*.apk
